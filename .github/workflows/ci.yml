name: CI

on:
  pull_request:
    paths:
      - "apps/**"
      - "packages/**"
      - "server/**"
      - "webhook-api/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".github/workflows/ci.yml"

  push:
    branches: [main]
    paths:
      - "apps/**"
      - "packages/**"
      - "server/**"
      - "webhook-api/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.base.json"
      - "Dockerfile"
      - "docker-compose.yml"

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run buil